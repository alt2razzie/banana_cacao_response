    :root {

      --text-main: #1e1b4b;
      --text-muted: #5b5877;

      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text-main);
      padding: 16px 14px 48px;
      display: flex;
      justify-content: center;
    }
    .app-shell { width: 100%; max-width: 540px; }
    .hero-card {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 55%, #db2777 100%);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .hero-card h1 { margin: 0 0 8px; font-size: 1.38rem; line-height: 1.28; }
    .hero-card p { margin: 0; font-size: 0.9rem; opacity: 0.95; line-height: 1.45; }
    
    .progress-wrap {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      position: sticky;
      top: 10px;
      z-index: 20;
      border: 1px solid var(--border);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 7px;
    }
    .progress-track { height: 9px; background: var(--primary-soft); border-radius: 999px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      width: 14%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .section-tag {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .section-title { margin: 0 0 6px; font-size: 1.12rem; color: var(--text-main); }
    .section-desc { margin: 0; font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }
    .info-box {
      background: #faf7ff;
      border: 1px dashed #c4b5fd;
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 12px;
      font-size: 0.86rem;
      line-height: 1.5;
    }
    .info-box h3 { margin: 10px 0 4px; font-size: 0.86rem; color: var(--primary-dark); text-transform: uppercase; }
    .info-box h3:first-child { margin-top: 0; }
    .info-box ul { margin: 4px 0 8px; padding-left: 18px; }
    .q-title { font-size: 0.98rem; font-weight: 700; margin: 0 0 5px; line-height: 1.4; }
    .req-star { color: var(--danger); margin-left: 2px; }
    .q-sub { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 12px; }
    .option-list { display: flex; flex-direction: column; gap: 9px; }
    .option-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 13px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: #fcfbff;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .option-item.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
      color: var(--primary-dark);
    }
    .option-item input { accent-color: var(--primary); width: 18px; height: 18px; flex-shrink: 0; margin: 0; }
    .scale-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
    .scale-btn {
      padding: 12px 0;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: #fcfbff;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
    }
    .scale-btn.selected { background: var(--primary); border-color: var(--primary); color: #fff; }
    .scale-labels { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--text-muted); margin-top: 6px; font-weight: 600; }
    .other-input, .textarea-input {
      width: 100%;
      margin-top: 10px;
      padding: 12px 13px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--text-main);
    }
    .textarea-input { min-height: 105px; resize: vertical; }
    .nav-bar { display: flex; gap: 10px; margin-top: 16px; }
    .btn {
      flex: 1;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: none;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary { background: #e9e2ff; color: var(--primary-dark); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
    .btn:disabled { opacity: 0.55; }
    .error-msg {
      background: #ffe4e6;
      color: var(--danger);
      border: 1px solid #fecdd3;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }
    .thank-you { text-align: center; padding: 28px 18px; }
    .thank-you .emoji-big { font-size: 3.2rem; margin-bottom: 10px; }
  </style>
</head>

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderRadioCard(qKey, num, label, sub, options, otherKey = null, otherTrigger = "Other") {
      const currentVal = state.answers[qKey];
      const showOther = otherKey && currentVal === otherTrigger;
      const otherVal = otherKey ? state.answers[otherKey] : "";
      return `
        <div class="card">
          <div class="q-title">${num}. ${label}<span class="req-star">*</span></div>
          <div class="q-sub">${sub || "Select one option"}</div>
          <div class="option-list">
            ${options.map(opt => {
              const checked = currentVal === opt;
              return `<label class="option-item ${checked ? "selected" : ""}">
                <input type="radio" name="${qKey}" value="${escapeHtml(opt)}" ${checked ? "checked" : ""} />
                <span>${escapeHtml(opt)}</span>
              </label>`;
            }).join("")}
          </div>
          ${otherKey ? `<input type="text" class="other-input" data-other-key="${otherKey}" placeholder="Please specify..." value="${escapeHtml(otherVal)}" style="display:${showOther ? "block" : "none"};" />` : ""}
        </div>`;
    }

    function renderCheckboxCard(qKey, num, label, options, otherKey = null, otherTrigger = "Other") {
      const currentArr = state.answers[qKey] || [];

      return `

          <div class="q-title">${num}. ${label}<span class="req-star">*</span></div>
          <div class="q-sub">Select all that apply</div>
          <div class="option-list">
            ${options.map(opt => {
              const checked = currentArr.includes(opt);
              return `<label class="option-item ${checked ? "selected" : ""}">
                <input type="checkbox" data-check-key="${qKey}" value="${escapeHtml(opt)}" ${checked ? "checked" : ""} />
                <span>${escapeHtml(opt)}</span>
              </label>`;
            }).join("")}
          </div>
          ${otherKey ? `<input type="text" class="other-input" data-other-key="${otherKey}" placeholder="Please specify..." value="${escapeHtml(otherVal)}" style="display:${showOther ? "block" : "none"};" />` : ""}
        </div>`;
    }

      return `
        <div class="card">

          <div class="scale-row">

          <div class="scale-labels"><span>${escapeHtml(lowText)}</span><span>${escapeHtml(highText)}</span></div>
        </div>`;
    }

          ${renderRadioCard("q21_jar_size_reason", 21, "What is the main reason for your preferred jar size?", "", JAR_REASONS, null, "")}
          ${renderRadioCard("q22_expected_frequency", 22, "If you liked the product, how often would you expect to purchase Banana-Cacao Jam?", "", ["Weekly", "Two to three times a month", "Once a month", "Once every two to three months", "Only for special occasions", "I might try it once but probably would not repurchase", "I would not purchase it", "Not sure"])}
          ${renderRadioCard("q23_jars_per_occasion", 23, "How many jars would you most likely purchase per buying occasion?", "", ["One jar", "Two jars", "Three jars", "Four or more jars", "Depends on the price and size", "I would not purchase the product"])}`;
      } else if (p === 6) {
        container.innerHTML = `
          <div class="card"><span class="section-tag">Section 6</span><h2 class="section-title">Preferred Purchase Channels and Suggestions</h2><p class="section-desc">These questions will help assess where and how potential customers would prefer to purchase the product.</p></div>
          ${renderCheckboxCard("q24_preferred_channels", 24, "Where would you prefer to purchase Banana-Cacao Jam?", ["Social Media pages", "Flea Markets", "School or University", "Bakeries/Cafes", "Other"], "q24_preferred_channels_other", "Other")}
          ${renderCheckboxCard("q25_willingness_boosters", 25, "What would increase your willingness to purchase Banana-Cacao Jam?", ["Lower price", "Free samples or product tasting", "Discounts or bundle offers", "Smaller trial-size packaging", "Larger jar with better value", "Clear ingredient and nutrition information", "Evidence of food-safety and quality standards", "Customer reviews", "Convenient delivery or store availability", "Different levels of sweetness or cacao intensity", "I would not be interested regardless of these factors", "Other"], "q25_willingness_boosters_other", "Other")}
          <div class="card">
            <div class="q-title">26. Do you have any additional comments, suggestions, or expectations for Banana-Cacao Jam?</div>
            <div class="q-sub">Optional</div>
            <textarea class="textarea-input" id="q26Input" placeholder="Your answer...">${escapeHtml(state.answers.q26_comments)}</textarea>
          </div>`;
      }
      bindPageEvents();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function bindPageEvents() {
      document.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener("change", e => { state.answers[e.target.name] = e.target.value; renderPage(); }));
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.addEventListener("change", e => {
        const key = e.target.dataset.checkKey, val = e.target.value, arr = state.answers[key];
        if (e.target.checked) { if (!arr.includes(val)) arr.push(val); } else { state.answers[key] = arr.filter(x => x !== val); }
        renderPage();
      }));
      document.querySelectorAll(".scale-btn").forEach(btn => btn.addEventListener("click", () => { state.answers[btn.dataset.scaleKey] = Number(btn.dataset.scaleVal); renderPage(); }));
      document.querySelectorAll(".other-input").forEach(inp => inp.addEventListener("input", e => { state.answers[e.target.dataset.otherKey] = e.target.value; }));
      const q26 = document.getElementById("q26Input");
      if (q26) q26.addEventListener("input", e => { state.answers.q26_comments = e.target.value; });
    }

    function validateCurrentPage() {
      const a = state.answers, p = state.page;
      if (p === 1) {
        if (!a.q1_age_18_plus) return "Please answer Question 1.";
        if (a.q1_age_18_plus === "No") return "Sorry, this survey is intended for adults aged 18 and above.";
        if (!a.q2_consent) return "Please answer Question 2.";
        if (a.q2_consent.startsWith("No")) return "Voluntary agreement is required to proceed.";
      } else if (p === 2) {
        if (!a.q3_age_group || !a.q4_district || !a.q5_status) return "Please answer all questions on this page.";
        if (a.q5_status === "Other" && !a.q5_status_other.trim()) return "Please specify 'Other' for Question 5.";
      } else if (p === 3) {
        if (!a.q6_purchased_6m || !a.q7_purchase_frequency || !a.q8_spread_types.length || !a.q9_purchase_places.length || !a.q10_spend_per_purchase || !a.q11_influencing_factors.length) return "Please answer all required questions on this page.";
        if (a.q8_spread_types.includes("Other") && !a.q8_spread_types_other.trim()) return "Please specify 'Other' for Question 8.";
        if (a.q9_purchase_places.includes("Other") && !a.q9_purchase_places_other.trim()) return "Please specify 'Other' for Question 9.";
        if (a.q11_influencing_factors.includes("Other") && !a.q11_influencing_factors_other.trim()) return "Please specify 'Other' for Question 11.";
      } else if (p === 4) {
        if (!a.q12_prior_banana_cacao || !a.q13_interest_score || !a.q14_appeal_score || !a.q15_flavor_balance || !a.q16_motivations.length || !a.q17_concerns.length) return "Please answer all required questions on this page.";
        if (a.q16_motivations.includes("Other") && !a.q16_motivations_other.trim()) return "Please specify 'Other' for Question 16.";
        if (a.q17_concerns.includes("Other") && !a.q17_concerns_other.trim()) return "Please specify 'Other' for Question 17.";
      } else if (p === 5) {
        if (!a.q18_buy_4oz_180 || !a.q19_buy_8oz_250 || !a.q20_preferred_jar_size || !a.q21_jar_size_reason || !a.q22_expected_frequency || !a.q23_jars_per_occasion) return "Please answer all required questions on this page.";
      } else if (p === 6) {
        if (!a.q24_preferred_channels.length || !a.q25_willingness_boosters.length) return "Please answer Questions 24 and 25.";
        if (a.q24_preferred_channels.includes("Other") && !a.q24_preferred_channels_other.trim()) return "Please specify 'Other' for Question 24.";
        if (a.q25_willingness_boosters.includes("Other") && !a.q25_willingness_boosters_other.trim()) return "Please specify 'Other' for Question 25.";
      }
      return "";
    }

    async function submitSurvey() {
      if (!sbClient) { showError("Supabase key is missing in index.html."); return; }
      const nextBtn = document.getElementById("nextBtn");
      nextBtn.disabled = true; nextBtn.textContent = "Submitting...";
      const payload = {
        ...state.answers,
        q5_status_other: state.answers.q5_status === "Other" ? state.answers.q5_status_other.trim() : null,
        q8_spread_types_other: state.answers.q8_spread_types.includes("Other") ? state.answers.q8_spread_types_other.trim() : null,
        q9_purchase_places_other: state.answers.q9_purchase_places.includes("Other") ? state.answers.q9_purchase_places_other.trim() : null,
        q11_influencing_factors_other: state.answers.q11_influencing_factors.includes("Other") ? state.answers.q11_influencing_factors_other.trim() : null,
        q16_motivations_other: state.answers.q16_motivations.includes("Other") ? state.answers.q16_motivations_other.trim() : null,
        q17_concerns_other: state.answers.q17_concerns.includes("Other") ? state.answers.q17_concerns_other.trim() : null,
        q24_preferred_channels_other: state.answers.q24_preferred_channels.includes("Other") ? state.answers.q24_preferred_channels_other.trim() : null,
        q25_willingness_boosters_other: state.answers.q25_willingness_boosters.includes("Other") ? state.answers.q25_willingness_boosters_other.trim() : null,
        q26_comments: state.answers.q26_comments.trim() || null
      };
      const { error } = await sbClient.from("banana_cacao_responses").insert([payload]);
      if (error) { nextBtn.disabled = false; nextBtn.textContent = "Submit Survey 💜"; showError("Error: " + error.message); return; }
      localStorage.setItem(STORAGE_DONE_KEY, "true");
      renderThankYou();
    }

    function renderThankYou() {
      document.getElementById("progressWrap").style.display = "none";
      document.getElementById("navBar").style.display = "none";
      showError("");
      document.getElementById("pageContainer").innerHTML = `<div class="card thank-you"><div class="emoji-big">🍌🍫✨</div><h2 class="section-title">Salamat! Response Recorded</h2><p class="section-desc">Thank you for taking part in the market feasibility study for Banana-Cacao Jam!</p></div>`;
    }

    document.getElementById("backBtn").addEventListener("click", () => { if (state.page > 0) { state.page -= 1; renderPage(); } });
    document.getElementById("nextBtn").addEventListener("click", async () => {
      const err = validateCurrentPage();
      if (err) { showError(err); return; }
      if (state.page < TOTAL_PAGES - 1) { state.page += 1; renderPage(); } else { await submitSurvey(); }
    });

    if (localStorage.getItem(STORAGE_DONE_KEY) === "true") { renderThankYou(); } else { renderPage(); }
  </script>
</body>
</html>
